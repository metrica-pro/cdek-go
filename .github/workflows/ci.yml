name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  GO_VERSION: "1.26.4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -v -race -coverprofile=coverage.out ./...
      - name: Coverage report
        run: go tool cover -func=coverage.out | tail -1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...

  codegen:
    # Verify that the committed oapi-codegen output is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Pin version — @latest drifts the generator stamp on every PR
      - run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.1
      - run: oapi-codegen -config oapi-codegen-config.yaml api/cdek-api.yaml
      - run: git diff --exit-code -- pkg/cdek/client.go

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  integration:
    # Integration tests against real CDEK API (require secrets, skipped on PRs from forks)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run integration tests
        env:
          CDEK_TEST_CLIENT_ID: ${{ secrets.CDEK_TEST_CLIENT_ID }}
          CDEK_TEST_CLIENT_SECRET: ${{ secrets.CDEK_TEST_CLIENT_SECRET }}
        run: |
          if [ -n "$CDEK_TEST_CLIENT_ID" ]; then
            go test -tags=integration -v -timeout=60s ./...
          else
            echo "Sandbox credentials not set — skipping integration tests"
          fi
