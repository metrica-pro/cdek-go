version: "2"

run:
  timeout: 5m
  go: "1.26.4"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - gosec
    - bodyclose
    - noctx
    - unconvert
    - revive

issues:
  max-same-issues: 5
  exclusions:
    rules:
      # Generated file: oapi-codegen output
      - path: "pkg/cdek/client\\.go"
        linters:
          - errcheck
          - gosec
          - revive
          - unused
      - path: "_test\\.go"
        linters:
          - errcheck
          - gosec
