    \ time_from         | Время начала ожидания курьера (согласованное с получателем)\
    \ | time         | нет                |\n| 4.6   | time_to           | Время окончания\
    \ ожидания курьера (согласованное с получателем) | time         | нет        \
    \        |\n| 4.7   | comment           | Комментарий | string()     | нет   \
    \             |\n| 4.8   | source            | Источник создания договоренности,\
    \ может принимать значения: <br/> DAILY_CALL_TASK - согласование в рамках задания\
    \ на прозвон <br/> COURIER_SUPPORT - согласование при решении проблем курьеров\
    \ в ходе доставки <br/> EK5_INTEGRATION - согласование через интеграцию <br/>\
    \ WEB_SITE - согласование при отслеживании заказа на сайте <br/> MOBILE_APPLICATION\
    \ - согласование при отслеживании заказа в мобильном приложении <br/> SELF_CARE\
    \ - согласование через ЛК ЮЛ <br/> CABINET - согласование через ЛК ФЛ <br/> MIA_BOT\
    \ - согласование через голосовой бот \\\"Миа\\\" <br/> WEB_SITE_BOT - согласование\
    \ через чат-бот на сайте <br/> MESSENGER_BOT - согласование через бот в мессенджере\
    \ | string()     | да                 |\n| 4.9   | type              | Тип договоренности,\
    \ может принимать значения: <br/> DOOR - до двери <br/> WAREHOUSE - до ПВЗ <br/>\
    \ POSTAMAT - до постамата | string()     | да                 |\n| 4.10  | delivery_point\
    \    | Код офиса СДЭК (ПВЗ/постамата), на который будет доставлена посылка | string()\
    \     | нет                |\n\nДля типа события DELIV_PROBLEM attributes содержит:\n\
