  /v2/deliverypoints:
    get:
      summary: Получение списка офисов
      description: 'Метод предназначен для получения списка действующих офисов СДЭК.<br>

        <br>

        Мы не рекомендуем использовать статичный список офисов, т.к. в этом случае
        офисы могут быть неактуальны.<br>

        Рекомендуем делать запрос к методу и обновлять список офисов раз в сутки для
        корректного отображения актуального списка ПВЗ и постаматов.'
      operationId: getDeliverypoints
      tags:
      - delivery_point
      parameters:
      - name: code
        in: query
        required: false
        description: Код ПВЗ
        example: NSK1
        schema:
          maxLength: 255
      - name: type
        in: query
        required: false
        description: Тип офиса. Принимает значения "POSTAMAT", "PVZ", "ALL". При отсутствии
          параметра принимается значение по умолчанию «ALL».
        example: PVZ
        schema:
          enum:
          - POSTAMAT
          - PVZ
          - ALL
      - name: postal_code
        in: query
        required: false
        description: Почтовый индекс города, для которого необходим список офисов
        example: 630000
        schema:
          maxLength: 255
      - name: city_code
        in: query
        required: false
        format: int32
        description: Код населенного пункта СДЭК (метод "Список населенных пунктов")
        example: 270
        schema:
          format: int32
      - name: country_code
        in: query
        required: false
        description: Код страны в формате ISO_3166-1_alpha-2 (см. “Общероссийский
          классификатор стран мира”)
        example: RU
        schema:
          maxLength: 2
          minLength: 2
      - name: region_code
        in: query
        required: false
        format: int32
        description: Код региона СДЭК
        example: 5
        schema:
          format: int32
      - name: have_cashless
        in: query
        required: false
        description: 'Наличие терминала оплаты. Может принимать значения:<br>

          «1», «true» - есть;<br>

          «0», «false» - нет.'
        example: true
        schema:
          enum:
          - '1'
          - 'true'
          - '0'
          - 'false'
      - name: have_cash
        in: query
        required: false
        description: 'Есть прием наличных. Может принимать значения:<br>

          «1», «true» - есть;<br>

          «0», «false» - нет.'
        example: true
        schema:
          enum:
          - '1'
          - 'true'
          - '0'
          - 'false'
      - name: allowed_cod
        in: query
        required: false
        description: 'Разрешен наложенный платеж. Может принимать значения:<br>

          «1», «true» - есть;<br>

          «0», «false» - нет.'
        example: true
        schema:
          enum:
          - '1'
          - 'true'
          - '0'
          - 'false'
      - name: is_dressing_room
        in: query
        required: false
        description: 'Наличие примерочной. Может принимать значения:<br>

          «1», «true» - есть;<br>

          «0», «false» - нет.'
        example: true
        schema:
          enum:
          - '1'
          - 'true'
          - '0'
          - 'false'
      - name: weight_max
        in: query
        required: false
        format: int32
        description: Максимальный вес в кг, который может принять офис (значения больше
          0 - передаются офисы, которые принимают этот вес; 0 - офисы с нулевым весом
          не передаются; значение не указано - все офисы)
        example: 10
        schema:
          minimum: 0
          format: int32
      - name: weight_min
        in: query
        required: false
        format: int32
        description: Минимальный вес в кг, который принимает офис (при переданном
          значении будут выводиться офисы с минимальным весом до указанного значения)
        example: 5
        schema:
          minimum: 0
          format: int32
      - name: lang
        in: query
        required: false
        description: Локализация офиса.
        example: rus
        schema:
          default: rus
      - name: take_only
        in: query
        required: false
        description: 'Является ли офис только пунктом выдачи. Может принимать значения:<br>

          «1», «true» - есть;<br>

          «0», «false» - нет.'
        example: true
        schema:
          enum:
          - '1'
          - 'true'
          - '0'
          - 'false'
      - name: is_handout
        in: query
        required: false
        description: 'Является пунктом выдачи. Может принимать значения:<br>

          «1», «true» - есть;<br>

          «0», «false» - нет.'
        example: true
        schema:
          enum:
          - '1'
          - 'true'
          - '0'
          - 'false'
      - name: is_reception
        in: query
        required: false
        description: 'Есть ли в офисе приём заказов. Может принимать значения:<br>

          «1», «true» - есть;<br>

          «0», «false» - нет.'
        example: true
        schema:
          enum:
          - '1'
          - 'true'
          - '0'
          - 'false'
      - name: is_marketplace
        in: query
        required: false
        description: 'Офис для доставки "До маркетплейса". Может принимать значения:<br>

          «1», «true» - есть;<br>

          «0», «false» - нет.'
        example: true
        schema:
          enum:
          - '1'
          - 'true'
          - '0'
          - 'false'
      - name: is_ltl
        in: query
        required: false
        description: 'Работает ли офис с LTL (сборный груз). Может принимать значения:<br>

          «1», «true» - есть;<br>

          «0», «false» - нет.'
        example: true
        schema:
          enum:
          - '1'
          - 'true'
          - '0'
          - 'false'
      - name: ltl_acceptance_partners
        in: query
        required: false
        description: 'Принимает заказы LTL, которые будут доставляться партнерами.
          Может принимать значения:<br>

          «1», «true» - есть;<br>

          «0», «false» - нет.'
        example: true
        schema:
          enum:
          - '1'
          - 'true'
          - '0'
          - 'false'
      - name: ltl_issuance_partners
        in: query
        required: false
        description: 'Выдает заказы LTL, которые были доставлены партнерами. Может
          принимать значения:<br>

          «1», «true» - есть;<br>

          «0», «false» - нет.'
        example: true
        schema:
          enum:
          - '1'
          - 'true'
          - '0'
          - 'false'
      - name: fulfillment
        in: query
        required: false
        description: 'Офис с зоной фулфилмента. Может принимать значения:<br>

          «1», «true» - есть;<br>

          «0», «false» - нет.'
        example: true
        schema:
          enum:
          - '1'
          - 'true'
          - '0'
          - 'false'
      - name: fias_guid
        in: query
        required: false
        format: uuid
        description: Код города ФИАС
        example: e33970a6-0db6-4e35-832c-cc3312a1833e
        schema:
          format: uuid
      - name: size
        in: query
        required: false
        format: int32
        description: Ограничение выборки результата (размер страницы)
        example: 1000
        schema:
          minimum: 0
          format: int32
      - name: page
        in: query
        required: false
        format: int32
        description: Номер страницы выборки результата
        example: 2
        schema:
          minimum: 0
          format: int32
      responses:
        '200':
          description: OK
          contentType: application/json
          schema:
            $ref: '#/components/schemas/OfficeDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto1'
          examples: null
