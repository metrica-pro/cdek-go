            - нет НДС)
          format: int32
      description: Доп. сбор за доставку (которую ИМ берет с получателя) в зависимости
        от суммы заказа
    DeliveryRecipientCostRequestDto:
      title: DeliveryRecipientCostRequestDto
      required:
      - value
      properties:
        value:
          description: Сумма платежа, включая НДС. Сумма не может быть больше 50000000
            в валюте города получателя.
          format: float
        vat_sum:
          description: Сумма НДС
          format: float
        vat_rate:
          description: Ставка НДС с 01.01.2026 (значение - 0, 5, 7, 10, 16, 22, null
            - нет НДС)
          format: int32
      description: 'Доп. сбор за доставку, которую ИМ берет с получателя. Только для
        заказов "интернет-магазин".  <br>

        Для направлений Беларусь-Беларусь и РФ-Беларусь это поле игнорируется.'
    ItemRequestDto:
      title: ItemRequestDto
      required:
      - amount
      - cost
      - name
      - payment
      - ware_key
      - weight
      properties:
        name:
          description: 'Наименование товара (может также содержать описание товара:
            размер, цвет).<br>

            Согласно законодательству РФ, название товара или услуги должно быть конкретным,
            понятным, позволяющим идентифицировать товар или услугу, должны быть отражены
            конкретные товарные позиции.<br>

            Пример:<br>

            "товар 1" - некорректное наименование<br>

            "Джинсы мужские Henry, размер M" - корректное наименование'
        ware_key:
          description: "Идентификатор/артикул товара.  <br>\n Артикул товара может\
            \ содержать только символы: [A-z А-я 0-9 ! @ \" # № $ ; % ^ : & ? * ()\
            \ _ - + = ? < > , .{ } [ ]  / , пробел].  <br>\n При передаче одинаковых\
            \ артикулов в рамках одной упаковки, артикул будет заменяться на: {ware_key}_*\
            \ , где * – это 7 случайных символов."
        marking:
          description: 'Маркировка товара согласно системе и кодам маркировки «Честный
            знак».<br>

            Если для товара/вложения указана маркировка, amount не может быть больше
            1.<br>

            Для корректного отображения маркировки товара в чеке требуется передавать
            НЕ РАЗОБРАННЫЙ тип маркировки, который может выглядеть следующим образом:<br>

            <br>

            1. Код товара в формате GS1  <br>

            Пример: 010468008549838921AAA0005255832GS91EE06GS92VTwGVc7wKCc2tqRncUZ1RU5LeUKSXjWbfNQOpQjKK+A<br>

            <br>

            2. Последовательность допустимых символов общей длиной в 29 символов.  <br>

            Пример: 00000046198488X?io+qCABm8wAYa<br>

            <br>

            3. Меховые изделия. Имеют собственный формат.  <br>

            Пример: RU-430302-AAA7582720<br>

            <br>

            (GS следует передавать, как символ ASCII 29)'
        payment:
          $ref: '#/components/schemas/MoneyDto'
        weight:
          description: Вес
          format: int32
        weight_gross:
          description: Вес брутто. Обязательно для международных заказов и доместиковых
            заказов с доп.типом "ТО для последней мили".
          format: int32
        amount:
          description: Количество единиц товара (в штуках). Количество одного товара
            в заказе может быть от 1 до 999
          format: int32
        name_i18n:
          description: Наименование на иностранном языке. Обязательно для международных
            заказов и доместиковых заказов с доп.типом "ТО для последней мили".
        brand:
          description: Бренд на иностранном языке. Обязательно для международных заказов
            и доместиковых заказов с доп.типом "ТО для последней мили".
        country_code:
          description: 'Код страны производителя товара в формате ISO_3166-1_alpha-2  <br>

            Обязательно для международных заказов и доместиковых заказов с доп.типом
            "ТО для последней мили".'
        material:
          description: Код материала (см. Приложение 7). Обязательно для международных
            заказов и доместиковых заказов с доп.типом "ТО для последней мили".
        wifi_gsm:
          description: Содержит wifi/gsm. Обязательно для международных заказов и
            доместиковых заказов с доп.типом "ТО для последней мили".
        url:
          description: Ссылка на сайт интернет-магазина с описанием товара. Обязательно
            для международных заказов и доместиковых заказов с доп.типом "ТО для последней
            мили".
        seller:
          $ref: '#/components/schemas/SellerItemDto'
        cost:
          description: 'Объявленная стоимость товара (за единицу товара в валюте взаиморасчетов,
            значение >=0).  <br>

            С данного значения рассчитывается страховка.'
        feacn_code:
          description: Код ТН ВЭД
        jewel_uin:
          description: УИН ювелирного изделия
        used:
          description: Признак товара б/у, применим для c2c заказов.
      description: Описание товара
    MoneyDto:
      title: MoneyDto
      required:
      - value
      properties:
        value:
          description: Сумма платежа, включая НДС. Сумма не может быть больше 50000000
            в валюте города получателя.
          format: float
        vat_sum:
          description: Сумма НДС. Обязательно, если передано payment.vat_rate
          format: float
        vat_rate:
          description: Ставка НДС с 01.01.2026 (значение - 0, 5, 7, 10, 16, 22, null
            - нет НДС)
          format: int32
    OrderCreateRequestDto:
      required:
      - packages
      - recipient
      - tariff_code
      properties:
        type:
          description: 'Тип заказа.<br>

            - 1 - "интернет-магазин" (только для договора типа "Договор с ИМ"),<br>

            - 2 - "доставка" (для любого договора).'
          format: int32
        additional_order_types:
          uniqueItems: true
          description: 'Дополнительные типы заказа: <br>

            - 2 - для сборного груза (LTL). Совместим с типом заказа "ИМ"/"Доставка",<br>

            - 4 - для Forward. Совместим с типом заказа "ИМ",<br>

            - 6 - для "Фулфилмент. Приход". Совместим с типом заказа "ИМ"/"Доставка",<br>

            - 7 - для "Фулфилмент. Отгрузка". Совместим с типом заказа "ИМ",<br>

            - 9 - для Форвард.Экспресс (Forward.Express). Совместим с типом заказа
            "ИМ", <br>

            - 10 - для доставки шин по тарифу "Экономичный экспресс". Совместим с
            типом заказа "ИМ"/"Доставка", <br>

            - 11 - для доставки в рамках одного офиса "Один офис (ИМ)" (при условии,
            что офис отправителя и получателя совпадают). Совместим с типом заказа
            "ИМ"/"Доставка",<br>

            - 14 - для CDEK.Shopping. Совместим с типом заказа "ИМ, <br>

            - 15 - для "ТО для последней мили" (отправка доместик (РФ-РФ) заказов
            по доп.типу "ТО+посл.миля" возможна только из МСК и складов: MSK662, 1
            Рейсовая MSK1938, ТО, Москва, Москва-Карго, 1, RU и KHME33, ТО, Химки,
            Шереметьевское шоссе, 9, RU). Совместим с типом заказа "ИМ"/"Доставка".'
          items:
            format: int32
        number:
          description: Номера заказа в ИС Клиента. Только для заказов "интернет-магазин".
            Может содержать только цифры, буквы латинского алфавита или спецсимволы
            (формат ASCII)
        accompanying_number:
          description: Номер сопроводительной накладной на товар (СНТ)
        tariff_code:
          description: Код тарифа
          format: int32
        comment:
          description: Комментарий к заказу
        shipment_point:
          description: Код ПВЗ СДЭК, на который будет производиться самостоятельный
            привоз клиентом. Обязательное поле, если заказ с тарифом "от склада".
            Не может использоваться одновременно с from_location
        delivery_point:
          description: Код ПВЗ СДЭК, на который будет доставлена посылка. Обязательное
            поле, если заказ с тарифом "до склада" или "до постамата". Не может использоваться
            одновременно с to_location
        date_invoice:
          description: 'Дата инвойса. Обязательное поле, если заказ - международный
            с типом "интернет-магазин".  <br>

            Если поле заполнено, то заказ автоматически становится международным.'
          format: date
        shipper_name:
          description: 'Грузоотправитель. Обязательное поле, если заказ - международный
            с типом "интернет-магазин".  <br>

            Если поле заполнено, то заказ автоматически становится международным.'
        shipper_address:
          description: 'Адрес грузоотправителя. Обязательное поле, если заказ - международный
            с типом "интернет-магазин".  <br>

            Если поле заполнено, то заказ автоматически становится международным.'
        delivery_recipient_cost:
          $ref: '#/components/schemas/DeliveryRecipientCostRequestDto'
        delivery_recipient_cost_adv:
          description: 'Доп. сбор за доставку (которую ИМ берет с получателя) в зависимости
            от суммы заказа (ДСД).

            <br><br>

            Только для заказов "интернет-магазин". Возможно указать несколько порогов.<br>

            ДСД применима только с доп. услугой «ЧАСТИЧНАЯ ДОСТАВКА» - в случае,<br>

            если получатель купил одну или несколько позиций, или получатель полностью
            отказался от выкупа товара.

            <br><br>

            Если при полном отказе от товара оплачивать доп. сбор не требуется, тогда
            при настройке порогов стоимости необходимо передавать дополнительную товарную
            позицию «Доставка» в количестве 1 шт. стоимостью 0 рублей, дополнительный
            сбор за доставку - 0 рублей и далее пороги ДСД. <br>

            <br>

            Если при полном отказе от товара необходимо взять доп. сбор за доставку,
            то при настройке порогов в интеграции, необходимо указать дополнительную
            товарную позицию «Доставка» в количестве 1 шт. стоимостью 0 рублей, сумму
            доп.сбора за доставку с получателя необходимо задать при минимальном пороге
            стоимости, далее пороги ДСД, комментарии к заказу о необходимости вручения
            позиции "Доставка".'
          items:
            $ref: '#/components/schemas/DeliveryCostThresholdDto'
        sender:
          $ref: '#/components/schemas/SenderContactDto'
        seller:
          $ref: '#/components/schemas/SellerDto'
        recipient:
          $ref: '#/components/schemas/RecipientContactDto'
        from_location:
          $ref: '#/components/schemas/RequestFromLocationDto'
        to_location:
          $ref: '#/components/schemas/RequestToLocationDto'
        services:
