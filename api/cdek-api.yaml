            заказе может быть от 1 до 255
          items:
            $ref: '#/components/schemas/PackageRequestDto'
        is_client_return:
          description: 'Признак клиентского возврата.  <br>

            Необходимо использовать, если прямой заказ доставлялся другой курьерской
            службой, либо по прямому заказу необходимо вернуть не все товары.  <br>

            Иначе необходимо использовать отдельный метод "Клиентские возвраты" (POST
            /v2/orders/{order_uuid}/clientReturn)'
        has_reverse_order:
          description: Признак необходимости создания реверсного заказа
        developer_key:
          description: Ключ разработчика
        print:
          description: Тип печатной формы, которую необходимо сформировать по заказу
          enum:
          - WAYBILL
          - BARCODE
        widget_token:
          description: Токен CMS, содержащий дополнительные данные для заполнения
            данных о заказе
      description: Запрос на создание заказа в рамках протокола
    PackageRequestDto:
      title: PackageRequestDto
      required:
      - number
      - weight
      properties:
        number:
          description: Номер упаковки (можно использовать порядковый номер упаковки
            заказа или номер заказа), уникален в пределах заказа. Идентификатор заказа
            в ИС Клиента
        weight:
          description: Общий вес (в граммах)
          format: int32
        length:
          description: "Габариты упаковки. Длина (в сантиметрах). Обязателен в случаях,\
            \ <br>\n если указаны остальные габариты или <br>\n если заказ до постамата\
            \ или <br>\n если общий вес >= 100 гр"
          format: int32
        width:
          description: "Габариты упаковки. Ширина (в сантиметрах). Обязателен в случаях,\
            \ <br>\n если указаны остальные габариты или <br>\n если заказ до постамата\
            \ или <br>\n если общий вес >= 100 гр"
