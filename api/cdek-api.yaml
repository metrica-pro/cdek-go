    \ string()     | да                 |\n| 4.4   | create_date       | Дата возникновения\
    \ проблемы                                              | dateTime     | да  \
    \               |\n\nДля типа события COURIER_INFO attributes содержит:\n\n| **№**\
    \ | **Название поля** | **Описание**                                         \
