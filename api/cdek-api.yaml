        интернет-магазина на получение вебхуков.
      operationId: getAll
      tags:
      - webhook
      parameters: []
      responses:
        '200':
          description: OK
          contentType: application/json
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WebhookDto'
          examples: null
    post:
      summary: Добавление подписки на вебхуки
      description: Метод предназначен для подключения подписки на отправку на URL
        клиента событий, связанных с заказом. Существуют следующие типы подписок:<br>•
        об изменении статуса заказа<br>• о готовности печатной формы<br>• получение
        информации о закрытии преалерта<br>• получение информации об изменении доступности
        офиса<br>• получение информации об изменении заказа<br>• получение информации
        о транспорте для СНТ<br>• получение информации об изменении договоренности
