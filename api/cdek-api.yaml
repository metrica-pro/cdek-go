    \ по которому зарегистрирована новая договоренность | string()     | да      \
    \           |\n| 4.4   | date              | Дата доставки, согласованная с получателем.\
    \ Для типа договоренности WAREHOUSE и POSTAMAT эта дата не влияет на сроки доставки\
