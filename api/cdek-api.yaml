      properties:
        uuid:
          type: string
          format: uuid
          description: Идентификатор вебхука
          readOnly: true
        type:
          type: string
          description: Тип вебхука.<br>• ORDER_STATUS - событие по статусам;<br>•
            PRINT_FORM - готовность печатной формы;<br>• PREALERT_CLOSED - получение
            информации о закрытии преалерта;<br>• ACCOMPANYING_WAYBILL - получение
            информации о транспорте для СНТ;<br>• OFFICE_AVAILABILITY - получение
            информации об изменении доступности офиса;<br>• ORDER_MODIFIED - получение
            информации об изменении заказа;<br>• DELIV_AGREEMENT - получение информации
            об изменении договоренности о доставке;<br>• DELIV_PROBLEM - получение
            информации о проблемах доставки по заказу;<br>• COURIER_INFO - получение
            информации о курьере.<br>Если у клиента уже есть подписка с указанным
            типом, то будет создана еще одна подписка с таким же типом
          enum:
          - ORDER_STATUS
          - ORDER_MODIFIED
          - PRINT_FORM
          - RECEIPT
          - PREALERT_CLOSED
          - ACCOMPANYING_WAYBILL
          - OFFICE_AVAILABILITY
          - DELIV_PROBLEM
          - DELIV_AGREEMENT
          - COURIER_INFO
        url:
          type: string
          description: URL, на который отправляется событие
      description: Вебхук
