        type:
          type: string
          description: Тип запроса
          enum:
          - CREATE
          - UPDATE
          - DELETE
          - AUTH
          - GET
        date_time:
          type: string
          description: Дата и время установки текущего статуса запроса
          format: date-time
        state:
          type: string
          description: Текущее состояние запроса
          enum:
          - ACCEPTED
          - SUCCESSFUL
          - INVALID
        errors:
          type: array
          description: Ошибки, возникшие в ходе выполнения запроса
          items:
            $ref: '#/components/schemas/ErrorDto2'
      description: Информация о запросе
    ResponseDto:
