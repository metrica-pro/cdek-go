      - uuid
      properties:
        uuid:
          description: Идентификатор сущности в ИС СДЭК
          format: uuid
        type:
          description: 'Тип связанной сущности.  <br>

            Может принимать значения:<br>

            - return_order - возвратный заказ (возвращается для прямого, если заказ
            не вручен и по нему уже был сформирован возвратный заказ)<br>

            - direct_order - прямой заказ (возвращается для возвратного и реверсного
            заказа)<br>

            - waybill - квитанция к заказу (возвращается для заказа, по которому есть
            сформированная квитанция)<br>

            - barcode - ШК места к заказу (возвращается для заказа, по которому есть
            сформированный ШК места)<br>

            - reverse_order - реверсный заказ (возвращается для прямого заказа, если
            подключен реверс)<br>

            - delivery - актуальная договоренность о доставке<br>

            - client_return_order - заказ клиентский возврат (возвращается для прямого
            заказа, к которому привязан клиентский возврат)<br>

            - client_direct_order - прямой заказ, по которому оформлен клиентский
            возврат'
          enum:
          - return_order
          - direct_order
          - client_return_order
          - client_direct_order
          - waybill
          - barcode
          - reverse_order
          - delivery
