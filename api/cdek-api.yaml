          maxLength: 255
          description: 'Текущее состояние запроса. Может принимать значения:<br>

            - ACCEPTED - пройдена предварительная валидация и запрос принят<br>

            - WAITING - запрос ожидает обработки (зависит от выполнения другого запроса)<br>

            - SUCCESSFUL - запрос обработан успешно<br>

            - INVALID - запрос обработался с ошибкой'
        errors:
          description: Ошибки, возникшие в ходе выполнения запроса
          items:
            $ref: '#/components/schemas/ErrorDto1'
        warnings:
          description: Предупреждения, возникшие в ходе выполнения запроса
