    \ yyyy-MM-dd'T'HH:mm:ssZ) | datetime     | да                 |\n| reason_code\
    \       | Дополнительный код статуса                                     | string(2)\
    \    | нет                |\n| city              | Наименование места возникновения\
    \ статуса                       | string(255)  | нет                |\n\n# Описание\
    \ сервиса\n\n\nСервис информационного взаимодействия реализует набор методов,\
    \ необходимых для передачи и синхронизации данных между компанией СДЭК и клиентом\
    \ интернет-магазином или партнером, представляющим интернет-магазин.\n\nВзаимодействие\
    \ с сервисом происходит в режиме онлайн с помощью стандартного протокола HTTPS\
    \ и формата JSON.\n\nИнициатором запросов является как ИС клиента, так и СДЭК\
    \ (в части вебхуков).\n\n# Режим взаимодействия\n\nПлатформа интеграции ИС СДЭК\
    \ реализует асинхронный режим, предусматривающий синхронный возврат ответа.\n\n\
    Иными словами, мы принимаем запрос на выполнение действия над какой-либо сущностью\
    \ (например, заказом), синхронно выполняем предварительную статичную валидацию.\
    \ Если данный этап выполнился успешно, то возвращается ответ (HTTP 202) с UUID\
    \ сущности. Параллельно ответу (HTTP 202) в системе запускается фоновый процесс\
    \ полной валидации (например, проверка доступности маршрута, тарифа и т.д.) и\
    \ выполнение действия над сущностью в основной системе СДЭК.\n\nИнформацию по\
    \ статусам асинхронной обработки можно запрашивать по UUID и в некоторых случаях\
    \ по другим параметрам, а также через вебхуки по подписке.\n\nИнформация по заказам,\
    \ созданным через сервис Интеграция, хранится в базе данных Интеграции 1 год.\
    \ Возможно получить информацию по заказам, которые были созданы ранее, обратившись\
    \ к закрепленному менеджеру СДЭК.\n\n# Правила формирования сообщений\n\nПри формировании\
    \ сообщения необходимо руководствоваться следующими правилами:\n\n<br>• В заголовке\
    \ обязательно необходимо передавать токен авторизации.\n<br>• Обмен сообщениями\
    \ должен осуществляться в кодировке UTF-8.\n<br>• Если элемент сообщения является\
    \ необязательным, то такой элемент в сообщении может отсутствовать, либо значение\
    \ элемента может быть пустым.\n<br>• Если элемент сообщения является обязательным,\
    \ то он не может быть пустым.\n\n# Описание структуры вебхуков\n\nВебхуки предназначены\
    \ для отправки на URL клиента событий:\n\n<br>• об изменении статуса заказа\n\
    <br>• о готовности печатной формы\n<br>• получение информации о закрытии преалерта\n\
    <br>• получение информации об изменении доступности офиса\n<br>• получение информации\
    \ об изменении заказа\n<br>• получение информации о транспорте для СНТ\n<br>•\
    \ получение информации об изменении договоренности о доставке\n<br>• получение\
    \ информации о проблемах доставки по заказу\n<br>• с данными курьера, назначенного\
    \ по заказу/заявке\n\n<br>Примечания: \n<br>• Таймаут подключения - 15 секунд.\
    \ При возникновении ошибки таймаута подключения система автоматически повторяет\
    \ отправку вебхука.\n<br>• Ограничение повторных попыток - при многократных ошибках\
    \ таймаута действует система лимитов:\n  <br>- максимум 12 попыток отправки в\
    \ течение 75 минут;\n  <br>- при превышении лимита система прекращает дальнейшие\
    \ попытки доставки вебхука;\n  <br>- если лимит повторных попыток исчерпан, все\
    \ активные подписки, связанные с проблемным URL-адресом, автоматически отключаются\
    \ для предотвращения системных сбоев.\n<br>• Если отправка вебхуков неуспешна\
    \ и ошибка не связана с таймаутом, т.е. наш сервис не получил от клиента ответ\
    \ 200 ОК, то подписка, на которую была попытка отправить вебхуки, будет удалена\
    \ через 24 часа.\n<br>• Существует ограничение на количество подписок на вебхуки.\
    \ У каждого клиента может быть не более двух подписок.\n\nПосле подключения подписки\
    \ на вебхуки, на указанный клиентом URL приходит событие в формате JSON:\n\n|\
    \ **№** | **Название поля** | **Описание**                   | **Тип поля** |\
    \ **Обязательность** |\n|-------|-------------------|--------------------------------|--------------|--------------------|\n\
    | 1     | type              | Тип события: <br/> - ORDER_STATUS - событие по статусам\
    \ <br/> - PRINT_FORM - готовность печатной формы <br/>- PREALERT_CLOSED - получение\
    \ информации о закрытии преалерта <br/>- ACCOMPANYING_WAYBILL - получение информации\
    \ о транспорте для СНТ <br/>- OFFICE_AVAILABILITY - получение информации об изменении\
    \ доступности офиса <br/>- ORDER_MODIFIED - получение информации об изменении\
    \ заказа <br/>- DELIV_AGREEMENT - получение информации об изменении договоренности\
    \ о доставке <br/>- DELIV_PROBLEM - получение информации о проблемах доставки\
    \ по заказу <br/>- COURIER_INFO - данные курьера, назначенного по заказу/заявке\
    \                                              | string       | да           \
    \      |\n| 2     | date_time         | Дата и время события в формате ISO 8601:\
