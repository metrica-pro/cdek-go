            в заказе упаковки
      description: Информация об упаковке
    HintReasonDto:
      title: HintReasonDto
      properties:
        code:
          description: 'Код причины ограничения. Может принимать значения: FEACN_RESTRICTION,
            GENERAL_RESTRICTION.

            Так как статусы FORBIDDEN, LIMITED, ALLOWED у грузоместа могут быть порождены
            как самим грузоместом, так и товарами в нем, то для уточнения передаем
            причину статуса ограничения:


            FEACN_RESTRICTION - ограничение на товар(ы) по направлению. Ограничение
            на конкретные товары внутри грузоместа:

            GENERAL_RESTRICTION - общее ограничение на грузоместо(а) по направлению.
            Не зависит от конкретного содержимого грузоместа. Для выставления данного
            ограничения анализируются весогабаритные характеристики грузоместа, его
            цена, количество мест в заказе и пр..'
        name:
          description: Наименование причины
      description: Причина статуса
