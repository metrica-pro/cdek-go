          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto1'
          examples: null
      requestBody:
        contentType: application/json
        required: true
        schema:
          $ref: '#/components/schemas/CreateClientReturnRequestDto'
        examples: null
