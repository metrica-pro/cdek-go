          format: int32
        sum:
          description: Доп. сбор за доставку товаров, общая стоимость которых попадает
            в интервал. Сумма не может быть больше 50000000 в валюте города получателя.
          format: float
        vat_sum:
          description: Сумма НДС. Обязательно, если передано delivery_recipient_cost_adv.threshold.vat_rate
          format: float
        vat_rate:
