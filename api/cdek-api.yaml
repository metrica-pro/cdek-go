  /v2/orders/{uuid}/clientReturn:
    post:
      summary: Регистрация клиентского возврата
      description: "Метод предназначен для оформления клиентских возвратов для интернет-магазинов.<br>\n\
        Клиентский возврат — это возврат, который оформляет сам клиент уже после получения\
        \ (вручения) заказа (создается только для заказов интернет-магазина в конечном\
        \ статусе \"Вручен\").<br>\nОтличие от обычного возврата в конечном статусе\
        \ прямого заказа: у клиентских возвратов конечный статус \"вручен\" и возврат\
        \ оформляет сам клиент, у обычных возвратов, конечный статус \"Не вручен\"\
        \ и возврат оформляется СДЭКом. Для частично врученных заказов можно оформить\
        \ и клиентский возврат и обычный возврат. \nКлиентский возврат связывается\
        \ с прямым заказом СДЭК. Если прямая доставка осуществлялась не СДЭК, для\
        \ создания обратного заказа необходимо использовать метод \"Регистрация заказа\"\
        \ - если заказ оформляется как клиентский возврат, необходимо в запросе на\
        \ регистрацию передать поле is_client_return = true."
      operationId: clientReturn
      tags:
      - order
      parameters:
      - name: uuid
        in: path
        required: true
        description: Идентификатор прямого заказа в ИС СДЭК, по которому необходимо
          зарегистрировать клиентский возврат
