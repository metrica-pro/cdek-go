    \                        |\n\n# FAQ. Часто задаваемые вопросы\n\n**1 Вопрос:**\n\
    \nПочему при создании заказа от двери заявка не создается автоматически?\n\n**Ответ:**\n\
    \nДействительно, при создании Заказа от двери через API Заявка на вызов курьера\
    \ не создается автоматически, \nтак как являются разными бизнес процессами. Необходимо\
    \ воспользоваться методом \\\"Регистрация заявки на вызов курьера\\\" . \nЕсли\
    \ в запросе не передан атрибут \\\"cdek_number\\\" и \\\"order_uuid\\\", то создается\
    \ заявка на забор консолидированного груза \n(сразу нескольких заказов с одного\
    \ адреса отправителя).\n\n<br>**2 Вопрос:**\n\nКак мне узнать код тарифа/код дополнительной\
    \ услуги?\n\n**Ответ:**\n\n• С кодами Тарифов можно ознакомиться в разделе \"\
    Приложение 4. Тарифы СДЭК\" по ссылке https://apidoc.cdek.ru/#tag/common/Prilozheniya/Prilozhenie-4.-Tarify-SDEK,\
    \ \nлибо получить актуальный на текущий момент список тарифов, доступных для вашего\
    \ договора (если интеграция уже подключена) с помощью метода \"Список доступных\
    \ тарифов\" https://apidoc.cdek.ru/#tag/calculator/operation/availableTariffs\n\
    <br>• С кодами Дополнительных услуг можно ознакомиться в нашей документации Приложение\
    \ 6 по ссылке: https://apidoc.cdek.ru/#tag/common/Prilozheniya/Prilozhenie-6.-Dopolnitelnye-uslugi\n\
    \n<br>**3 Вопрос:**\n\nВ чем отличие доп. сбора за доставку delivery_recipient_cost\
    \ и динамического доп. сбора delivery_recipient_cost_adv в запросе на регистрацию\
    \ заказа? В каких случаях какой использовать?\n\n**Ответ:**\n\nВ случае, если\
    \ требуется взять с получателя дополнительный сбор за доставку при вручении заказа\
    \ - необходимо передать тег delivery_recipient_cost (поля value, vat_sum, vat_rate)\n\
    Также эта сумма может быть динамической - в таком случае можно использовать тег\
    \ delivery_recipient_cost_adv, указать в нем порог выкупа и сбор за доставку.\
    \ Например, при выкупе менее 5000 рублей, получатель должен оплатить за доставку\
    \ 500 рублей, а при большем выкупе - доставка будет бесплатной, тогда необходимо\
    \ будет указать такие значения:\n```json\n\"delivery_recipient_cost_adv\" : [{\n\
    \  \"sum\" : 500,\n  \"threshold\" : 5000\n}]\n```\nПорогов можно задавать любое\
    \ количество.\nЕсли при превышении последнего порога стоимости не надо брать сумму\
    \ за доставку, необходимо передать значение «Доп.сбор за доставку с получателя»\
    \ delivery_recipient_cost_adv 0 рублей.\nЕсли при превышении последнего порога\
    \ выкупа надо брать плату за доставку, то необходимо передать значение фиксированного\
    \ доп.сбора за доставку в поле «Доп.сбор за доставку с получателя» delivery_recipient_cost_adv.\n\
    \n<br>**4 Вопрос:**\n\nПочему не могу передать только название города при Регистрации\
    \ заказа?\n\n**Ответ:**\n\nИдентификация города производится по следующему алгоритму\
    \ в порядке приоритетности:\n<br>• По переданному коду ПВЗ.\n<br>• По уникальному\
    \ коду населенного пункта СДЭК. Значения передаются в атрибутах и to_location.code.\n\
    <br>• По координатам: необходимо передавать значения долготы (_location_longitude)\
    \ и широты (_location_latitude).\n<br>• По уникальному идентификатору ФИАС (код\
    \ адресного объекта, подробнее: https://fias.nalog.ru/). \nЗначения передаются\
    \ в атрибутах from_location.fias_guid и to_location.fias_guid.\n<br>• По почтовому\
    \ индексу города, коду страны, названию региона и названию города: \n*_location.code\
    \ + *_location.country_code + *_location.region + *_location.city. \nТакже в качестве\
    \ уточняющего параметра может быть передан район региона - *_location.sub_region.\n\
    <br>• По строке адреса. Если атрибуты, используемые в предыдущем пункте не пустые,\
    \ \nто из них формируется адресная строка + используется атрибут *_location.address,\
    \ если он не пуст.\n\nОпираясь на вышеописанный алгоритм, рекомендуем передавать\
    \ в запросах код города / индекс + наименование НП / ФИАС/ наименование НП + наименование\
    \ региона.\n\n<br>**5 Вопрос:**\n\nЧто означает ошибка \\\"shipment location is\
    \ not recognized\\\"?\n\n**Ответ:**\n\n\\\"shipment location is not recognized\\\
    \" - Не определен город Отправителя, так как передан не корректный город Отправления.\
    \ \nОбычно передан индекс без наименования, рекомендуем так же в паре передавать\
    \ уточняющий параметр \nнаименование населенного пункта (код города / индекс +\
    \ наименование НП / ФИАС/ наименование НП + наименование региона).\nОстальные\
    \ ошибки описаны в разделе \\\"Список ошибок интеграции\\\".\n\n<br>**6 Вопрос:**\n\
    \nПочему тестовая среда и реальная разные? Например у вас есть ПВЗ YEKB46, но\
    \ на тестовой среде его нет.\n\n**Ответ:**\n\nТестовая среда предназначена только\
    \ для тестирования методов интеграции. Данные по ПВЗ/городам на тестовой среде\
    \ различаются.\n\n<br>**7 Вопрос:**\n\nКакие габариты требуется передавать при\
    \ вызове курьера в случае если нет возможности точно рассчитать ДВШ всех товарных\
    \ позиций?\n\n**Ответ:**\n\n1-1-1 в соответствующих атрибутах \n\n<br>**8 Вопрос:**\n\
    \nЧто будет, если в запросе на регистрацию заказа передать офис, который закрыт/не\
    \ принимает грузы?\n\n**Ответ:**\n\nЕсли в запросе указывается код офиса, но он\
    \ не подходит по параметрам, то офис подменяется на ближайший с подходящими характеристиками.\
    \ Подмена работает по этим параметрам, если они указываются при регистрации заказа:\
    \ есть приём наложенного платежа и есть приём/выдача заказов.\n\nТакже ПВЗ/постамат\
    \ должен быть активен и у нас есть ограничение, что ПВЗ выбирается только в том\
    \ же городе (если код города совпадает).\n\nЕсли заказ оформляется в постамат,\
    \ но этот постамат и ближайшие постаматы не подходят по размерам ячейки, то заказ\
    \ будет автоматически перенаправлен на ближайший ПВЗ в городе (если подходящие\
    \ ПВЗ есть).\n\nС ПВЗ на постамат переадресации не происходит.\n\n<br>**9 Вопрос:**\n\
    \nПроисходит ли валидация номеров телефонов, переданных в запросах?\n\n**Ответ:**\n\
    \nНомер телефона отправителя (sender) валидируется на соответствие формату телефонов\
    \ в стране отправителя (телефонный код, количество символов).\n\nИсключение: если\
    \ телефон не соответствует формату страны отправителя, но соответствует формату\
    \ телефонов России, Казахстана, Китая или Малазии, заказ будет зарегистрирован\
    \ успешно.\n\nНомер телефона получателя (recipient) валидируется на соответствие\
    \ формату телефонов в стране получателя (телефонный код, количество символов).\n\
    \nИсключение: если телефон не соответствует формату страны отправителя, но соответствует\
    \ формату телефонов России, Казахстана, Китая или Малазии, заказ будет зарегистрирован\
    \ успешно.\n\nНомер телефона продавца (seller) валидируется на соответствие формату\
    \ телефонов в стране получателя (телефонный код, количество символов), а также\
    \ соответствие кода оператора пулу номеров активных телефонных операторов.\n\n\
