      properties:
        uuid:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        url:
          type: string
        length:
          type: integer
          format: int32
        ttlSeconds:
          type: integer
          format: int32
    ClientEntity:
      required:
