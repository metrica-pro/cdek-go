  /v2/delivery:
    post:
      summary: Регистрация договоренности о доставке
      description: "Метод позволяет фиксировать оговоренные с клиентом дату и время\
        \ доставки (приезда курьера), а так же изменять адрес доставки. В ответе возвращается\
        \ уникальный идентификатор договоренности и текущий статус запроса*. \n\n\
        *Метод работает асинхронно. Статус \"ACCEPTED\" в ответе на запрос не гарантирует,\
        \ что договоренность создана в ИС СДЭК. Этот статус относится к запросу (запрос\
        \ успешно принят) и говорит о том, что запрос прошел первичные валидации и\
        \ структурно составлен корректно. Далее запрос проходит остальные валидации,\
        \ результат можно получить с помощью метода получения информации о договоренности.\
        \ Статус запроса \"SUCCESSFUL\" - сущность успешно создана в системе, статус\
        \ \"INVALID\" - при создании возникла ошибка, необходимо её исправить и повторно\
        \ отправить запрос на регистрацию договоренности о доставке."
