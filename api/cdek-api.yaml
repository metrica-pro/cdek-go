    : \"\",\n        \"registration_mark\": \"\",\n        \"phone\": \"+79999999999,\
    \ доб. 123\"\n    }\n\n```\n\n# Требования к идентификаторам посылок и информации\
    \ на ярлыке\n\n<br>Предпочтительным для компании СДЭК является использование ее\
    \ собственных ярлыков (квитанций или ШК заказа), которые можно получить через\
    \ следующие методы:\n\n<br>• Формирования квитанции к заказу\n<br>• Формирование\
    \ ШК-места к заказу\n<br><br>\nВ случае использования собственного ярлыка он обязательно\
    \ должен содержать информацию о получателе (ФИО, адрес, телефон) и любой из идентификаторов.\n\
    <br><br>\nИдентификатор посылки СДЭК:\n<br>• В штрих-коде рекомендуется указывать\
    \ номер накладной СДЭК (в формате обмена данными — это атрибут «cdek_number»).\n\
    <br>• Идентификатор заказа ИМ — это номер заказа в ИС Клиента (атрибут «number»).\n\
    <br>• Идентификатор грузоместа (упаковки) — это штрих-код упаковки (атрибут «packages.number»).\n\
    \n<br>Все штрих-коды должны иметь расшифровку закодированного текста под или над\
    \ штрих-кодом, чтобы иметь возможность вводить вручную закодированную информацию.\n\
    Рекомендуется для печати использовать стандарт Code 128. \n\n# Список возможных\
    \ ошибок\n\n Если полученная ошибка не указана в списке ниже, просим сообщить\
    \ на почту integrator@cdek.ru \nили в чат-бот Тая на портале https://apidoc.cdek.ru/\n\
    \nСообщение об ошибке:\n\n```json \n{\n    ...\n    \"errors\": [\n        {\n\
    \            \"code\": \"code\",\n            \"message\": \"message\"\n     \
    \   }\n    ]\n}\n```\n\nПример ошибки: \n\n```json \n{\n    ...\n    \"requests\"\
    : [\n        {\n            \"request_uuid\": \"72753031-......\",\n         \
    \   \"type\": \"CREATE\",\n            \"date_time\": \"2017-11-19T14:48:13+0700\"\
    ,\n            \"state\": \"INVALID\",\n            \"errors\": [\n          \
    \      {\n                    \"code\": \"error_validate_im_dep_number_has_already_had_integration\"\
    ,\n                    \"message\": \"Введенный номер отправления ИМ не уникальный.\
    \ Введите уникальный номер.\"\n                }\n            ]\n        }\n \
    \   ]\n}\n```\n\n| **Код ошибки**                                            \
