        message:
          type: string
          description: Сообщение об ошибке
      description: Информация об ошибке
    ErrorResponseDto1:
      type: object
      properties:
        alerts:
          type: array
          description: Список ошибок
          items:
            $ref: '#/components/schemas/AlertDto'
      description: Стандартный формат ответа контроллера в случае ошибки
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v2/oauth/token
          scopes: {}
security:
- oauth2: []
tags:
- name: common
  description: "# Введение\n\nПортал документации CDEK API предоставляет разработчикам\
    \ и партнёрам компании СДЭК доступ к подробной информации и инструментам для интеграции\
    \ с логистической платформой. С его помощью можно эффективно использовать API-методы\
    \ для автоматизации процессов доставки и управления заказами.\n\nПортал документации\
    \ содержит в себе:\n\n  • Описание возможностей и функционала API СДЭК, включая\
    \ доступные методы и их применение\n\n  • Пошаговые инструкции по подключению\
    \ и настройке взаимодействия с системой СДЭК\n\n  • Справочник методов с фильтром\
    \ по категориям (работа с заказами, расчет стоимости и т.д.), внутри которых содержится\
    \ детальное описание каждого метода API, включая параметры запросов и ответов\
    \ с примерами\n  \nПортал документации обеспечивает удобную навигацию и доступ\
    \ к актуальной информации для успешной интеграции с сервисами СДЭК.\n\n# Подключение\
    \ к сервису\n\n![Image](https://public-static.cdek.ru/apidoc/logistic/service-connection.png)\n\
    \nДля интеграции с ИС СДЭК по протоколу обмена данными необходимо:\n\n<br>1. Заключить\
    \ договор со СДЭК\n<br>2. Ознакомиться с документацией и часто задаваемыми вопросами,\
    \ представленными на сайте www.cdek.ru/clients/integrator.html\n<br>3. Осуществить\
    \ реализацию, настройку и тестирование на тестовой среде `api.edu.cdek.ru` с помощью\
    \ тестовый учетной записи:\n\n| **Параметр** | **Значение**  |\n|---|---|\n| Account\
    \ | wqGwiQx0gg8mLtiEKsUinjVSICCjtTEP  |\n| Secure password | RmAmgvSgSl1yirlz9QupbzOJVqhCxcP5\
    \  |\n\nУ тестовой учетной записи имеются следующие ограничения:\n\n<br>- заказы\
    \ клиента, созданные под тестовой учетной записью, не отображаются в личном кабинете\
    \ клиента на сайте https://lk.cdek.ru/;\n<br>- тестовая учетная запись не имеет\
    \ привязки к договору, следовательно, для нее не работают скидки и наценки, установленные\
    \ в договоре;\n<br>- посылки для тестовых учетных записей не будут обрабатываться\
    \ и доставляться.\n\n\n<br>4. После того как все проверено (протестировано, все\
    \ вопросы решены), вам следует создать ключ для доступа к боевой учетной записи.\
    \ Когда ваш договор в статусе \\\"Подписан\\\", на почту автоматически будет отправлено\
    \ письмо с ключами доступа. Также ключи можно получить в личном кабинете: в разделе\
    \ \\\"Интеграция\\\" нажать кнопку \\\"Создать ключ\\\", затем в этом разделе\
    \ появится идентификатор аккаунта и пароль.<br>5. Запустить решение в продакшн,\
    \ используя хост api.cdek.ru для подключения к методам.\n\n<br>ИМ имеет возможность\
    \ получать уведомления о результате отправки данных на электронную почту. <br>Уведомления\
    \ содержат информацию как об удачной загрузке заказов, так и об ошибках передачи\
    \ данных. <br>От данных уведомлений можно отписаться, но следует помнить, что\
    \ все рассылки о проведении технических работ и изменениях в протоколе также высылаются\
    \ на данный адрес. <br>Все уведомления приходят с электронного адреса: noreply@cdek.ru\
    \ в формате UTF-8. <br>Для подключения уведомлений необходимо обратиться в службу\
    \ технической поддержки по почте integrator@cdek.ru \nлибо в чат-бот Тая на портале\
    \ https://apidoc.cdek.ru/ с указанием вашего номера договора. \n\n![Image](https://public-static.cdek.ru/apidoc/logistic/create-order.png)\n\
