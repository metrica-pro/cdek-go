components:
  schemas:
    RequestDto:
      required:
      - client_id
      - client_secret
      - grant_type
      type: object
      properties:
        grant_type:
          type: string
          description: 'Тип аутентификации. Доступное значение: client_credentials'
        client_id:
          type: string
          description: Идентификатор клиента
        client_secret:
          type: string
          description: Секретный ключ клиента
      description: Транспорт запроса на получение токена (авторизация пользователя)
    AuthResponseDto:
      required:
      - access_token
      - expires_in
      - jti
      - scope
      - token_type
      type: object
      properties:
        access_token:
          type: string
          description: JWT-токен
        token_type:
          type: string
          description: Тип токена. Всегда принимает значение bearer
        expires_in:
          type: integer
          description: Срок действия токена (по умолчанию 3600 секунд)
        scope:
          type: string
          description: Область действия токена (доступ к объектам и операциям над
            ними)
        jti:
          type: string
          description: Уникальный идентификатор токена
      description: Транспорт ответа на получение токена авторизации (авторизацию)
    ErrorResponseDto:
      required:
      - error
      - error_description
      type: object
      properties:
        error:
          type: string
          description: Ошибка
        error_description:
          type: string
          description: Описание ошибки
      description: Транспорт ответа на получение токена авторизации (авторизацию)
    ErrorDto:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Описание ошибки
      description: Ошибка, или предупреждение, возникшие в ходе выполнения запроса
    SimplifiedResponseDto:
      type: object
      properties:
        errors:
          type: array
          description: Список ошибок
          items:
            $ref: '#/components/schemas/ErrorDto'
      description: Транспорт с ошибками и предупреждениями
    SuggestCityResponseDto:
      required:
      - city_uuid
      - code
      - country_code
      - full_name
      type: object
      properties:
        city_uuid:
          maxLength: 255
          type: string
          description: Идентификатор населенного пункта СДЭК
          format: uuid
        code:
          type: integer
          description: Код населенного пункта СДЭК
          format: int32
        full_name:
          maxLength: 255
          type: string
          description: Наименование населенного пункта СДЭК (город, район, регион,
            страна)
        country_code:
          maxLength: 255
          type: string
