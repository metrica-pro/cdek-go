      summary: Получение ШК места к заказу
      description: "Метод используется для получения ШК места в формате pdf к заказу/заказам.\n\
        Ссылка на файл с ШК местом к заказу/заказам доступна в течение 1 часа.\n\n\
        В ответе метода возвращается набор статусов entity->statuses. Их значения\
        \ могут быть следующими\n| Код       | Название статуса    | Комментарий |\n\
        |-----------|---------------------|-------------|\n| ACCEPTED  | Принят  \
        \            | Запрос на формирование квитанции принят |\n| INVALID   | Некорректный\
        \ запрос | Некорректный запрос на формирование квитанции |\n| PROCESSING|\
        \ Формируется         | Файл с квитанцией формируется |\n| READY     | Сформирован\
        \         | Файл с квитанцией и ссылка на скачивание файла сформированы|\n\
        | REMOVED   | Удален\t             | Истекло время жизни ссылки на скачивание\
        \ файла с квитанцией|"
      operationId: barcodeGet
      tags:
