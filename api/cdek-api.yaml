    \ доступности офиса <br/> для ORDER_MODIFIED - дата получения информации об изменении\
    \ заказа <br/> для DELIV_AGREEMENT - дата получения информации о договоренности\
    \ <br/> для DELIV_PROBLEM - дата получения информации о проблеме доставки <br/>\
    \ для COURIER_INFO - дата получение данных о назначении курьера | datetime   \
    \  | да                 |\n| 3     | uuid              | Идентификатор сущности:\
    \ <br/> для ORDER_STATUS  - заказа <br/> для PRINT_FORM - печатной формы (квитанции\
    \ или ШК) <br/> для PREALERT_CLOSED - UUID преалерта <br/> для ACCOMPANYING_WAYBILL\
    \ - заказа <br/> для OFFICE_AVAILABILITY - офиса <br/> для ORDER_MODIFIED - заказа\
    \ <br/> для DELIV_AGREEMENT - заказа <br/> для DELIV_PROBLEM - заказа <br/> для\
    \ COURIER_INFO - заказа для task_type = DELIVERY, заявки для task_type = DEMAND\
    \  | UUID         | да                 |\n| 4     | attributes        | Атрибуты\
    \ события      |              | да                 |\n\nДля типа события ORDER_STATUS\
    \ attributes содержит:\n\n| **№**  | **Название поля**  | **Описание**     | **Тип\
    \ поля** | **Обязательность** |\n|--------|--------------------|------------------|--------------|--------------------|\n\
    | 4.1    | is_return          | Признак возвратного заказа: <br/> true - является\
    \ возвратной <br/> false - является прямой <br/>   | boolean      | да       \
