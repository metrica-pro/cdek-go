          description: Тип, который используется на фронте для выбора цвета фона,
            на котором отображается текст
          example: danger
          enum:
          - success
          - info
          - warning
          - danger
        msg:
          type: string
          description: Текст ошибки
          example: Внутренняя ошибка сервера.
        errorCode:
          type: string
          description: Технический код
          example: internal_error
        params:
          type: array
          description: Дополнительные параметры
          items:
