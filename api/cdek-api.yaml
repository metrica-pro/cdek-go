  /v2/orders/{uuid}/refusal:
    post:
      summary: Регистрация отказа
      description: 'Метод предназначен для регистрации отказа по заказу и дальнейшего
        возврата данного заказа в интернет-магазин.<br>После успешной регистрации
        отказа статус заказа переходит в "Не вручен" (код NOT_DELIVERED) с дополнительным
        статусом "Возврат, отказ от получения: Без объяснения" (код 11). Заказ может
        быть отменен в любом статусе*, пока не установлен статус "Вручен" или "Не
        вручен".<br>* Не рекомендуется использовать метод для заказов, которые находятся
        в статусе "Создан" и не планируются к отгрузке на склады СДЭК. В случае применения
        метода отказа для заказов, находящихся в статусе "Создан", по ним будут начислены
        операции и заказы будут включены в Акт оказанных услуг. Для отмены заказа
        в статусе "Создан" воспользуйтесь методом "Удаление заказа".'
      operationId: refuse
      tags:
      - order
      parameters:
      - name: uuid
        in: path
        required: true
