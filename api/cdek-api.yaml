      description: График работы офиса
    OfficeWorkTimeExcDto:
      title: OfficeWorkTimeExcDto
      properties:
        date: {}
        time: {}
        is_working: {}
    OfficeWorkTimeExceptionDto:
      title: OfficeWorkTimeExceptionDto
      required:
      - date_end
      - date_start
      - is_working
      properties:
        date_start:
          description: Дата начала исключения в работе офиса
          format: date
          example: '2020-01-01'
        date_end:
          description: Дата окончания исключения в работе офиса
          format: date
          example: '2020-02-02'
        time_start:
          description: Время начала работы в указанную дату
          example: 09:00
        time_end:
          description: Время окончания работы в указанную дату
          example: '18:00'
        is_working:
          description: Признак рабочего/нерабочего дня в указанную дату
          example: false
      description: Исключения в графике работы офиса
    ResponseDtoScheduleInfoDto:
      title: ResponseDto
      required:
      - requests
      properties:
        entity:
          $ref: '#/components/schemas/ScheduleInfoDto'
        requests:
          description: Информация о запросах, относящихся к сущности.
          items:
            $ref: '#/components/schemas/RequestDto1'
        related_entities:
          description: Связанные сущности
          items:
            $ref: '#/components/schemas/RelatedEntityDto'
      description: Ответ на запрос
    ScheduleInfoDto:
      title: ScheduleInfoDto
      required:
      - date
      - order_uuid
      - statuses
      - time_from
      - time_to
      - uuid
      properties:
        cdek_number:
          maxLength: 255
          description: Номер заказа СДЭК
        order_uuid:
          description: Идентификатор заказа в ИС СДЭК
          format: uuid
        date:
          description: Дата доставки, согласованная с получателем. (Если заказ "До
            склада", эта дата не влияет на сроки доставки и может быть произвольной).
            При прозвоне дата доставки до склада устанавливается в автоматическом
            режиме (дата создания прозвона +19 дней)
          format: date
        time_from:
          pattern: HH:mm
          description: Время доставки "С", согласованное с получателем. Обязательно,
            если заказ "до двери"
        time_to:
          pattern: HH:mm
          description: Время доставки "Пo", согласованное с получателем. Обязательно,
            если заказ "до двери"
        comment:
          maxLength: 255
          description: Комментарий к договоренности о доставке
        delivery_point:
          maxLength: 255
          description: Новый код ПВЗ СДЭК, на который будет доставлена посылка (если
            требовалось изменить)
        to_location:
          $ref: '#/components/schemas/ScheduleLocationDto'
        uuid:
          description: Идентификатор сущности в ИС СДЭК
          format: uuid
        statuses:
          description: Статусы договоренности о доставке
          items:
            $ref: '#/components/schemas/ScheduleStatusDto'
        source:
          description: 'Источник согласования (модуль, внешняя система, передающая
            данные о согласовании). Пример: DAILY_CALL_TASK'
      description: Договоренность о доставке
    ScheduleStatusDto:
      title: ScheduleStatusDto
