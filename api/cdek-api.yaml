    \      |\n\n\n# Глоссарий\n\n**ИС** — информационная система, это может быть ERP\
    \ – решение, сайт ИМ, любое другое программное обеспечение.\n\n**Интеграция**\
    \ — передача данных, находящихся в различных источниках (ИС)  и предоставление\
    \ данных пользователям в унифицированном виде.\n\n**API (англ. Application Programming\
    \ Interface)** – интерфейс прикладного программирования, интерфейс программирования\
    \ приложений. Это набор готовых функций, структур и констант, предоставляемых\
    \ приложением (библиотекой, сервисом) для использования во внешних программных\
    \ продуктах (ИС).\n\n**HTTP (англ. Hyper Text Transfer Protocol)** – протокол\
    \ передачи гипертекста. Это протокол прикладного уровня передачи данных (изначально\
    \ – в виде гипертекстовых документов в формате HTML).\n\n**HTTPS (англ. Hyper\
    \ Text Transfer Protocol Secure)** – расширение протокола HTTP, поддерживающее\
    \ шифрование. Данные, передаваемые по протоколу HTTP, «упаковываются» в криптографический\
    \ протокол SSL или TLS. В отличие от HTTP для  HTTPS по умолчанию используется\
    \ ТСР-порт 443.\n\n**XML  (англ. eXtensibleMarkupLanguage)** — расширяемый язык\
    \ разметки.\n\n**JSON  (англ. JavaScript Object Notation)** — текстовый формат\
    \ обмена данными, основанный на JavaScript.\n\n**ИМ** — интернет-магазин, клиент\
    \ или партнер СДЭК с договором интернет-магазина.\n\n**Место (грузоместо, упаковка)**\
    \ — неделимая единица груза, отправляемая ИМ (может быть несколько в одном заказе).\n\
    \n**Отправление (заказ)** — сумма всех мест, единовременно отправляемых ИМ по\
    \ одному направлению.\n\n**Объемный вес** — расчетное значение веса, измеряется\
    \ в кг. Расчет может быть произведен из указанных габаритов места по формуле длина\
    \ * высота * ширина/5000. Это общепринятый у транспортных компаний алгоритм пересчета.\n\
    \n**Физический вес** – определяется взвешиванием погрузочного места на весах.\
    \ Существуют вес груза нетто и брутто. Нетто — это чистый вес груза без упаковки,\
    \ а брутто — вес груза в упакованном виде.\n\n**Расчетный вес** – вес, максимальный\
    \ среди объемного и физического. Расчет стоимости услуг производится исходя из\
    \ расчетного веса.\n\n**ПВЗ** – пункт выдачи заказов получателю. Место, где получатель\
    \ может самостоятельно забрать свой груз. ПВЗ могут быть как собственные склады\
    \ СДЭК, так и терминалы выдачи грузов партнеров.\n\n**СД** – курьерская служба\
    \ доставки СДЭК.\n\n**ГМ** - грузоместо (упаковка)\n\n**ШК** - штрихкод, идентифицирующий\
    \ конкретное грузоместо\n\n**Международный заказ** - заказ, у которого страна\
    \ отправителя не равна стране получателя и хотя бы одна страна не входит в Таможенный\
    \ союз. \n\n# Базовые типы данных\n\nВ протоколе обмена используются следующие\
    \ типы данных:\n\n**string(n)** - текстовая строка, где n - максимальное количество\
    \ символов.\n\n**integer** - целочисленное значение из интервала от 0 до 1 000\
    \ 000.\n\n**float** - число с плавающей точкой, в качестве разделителя используется\
    \ точка.\n\n**boolean** - логическое значение (возможные значения: true или false).\n\
    \n**dateTime** - дата и время в формате ISO 8601: YYYY-MM-DDThh:mm:ss±hhmm.\n\n\
    **date** - дата в формате ISO 8601: YYYY-MM-DD.\n\n**time** - время в формате\
    \ ISO 8601: hh:mm.\n\n**UUID** - уникальный идентификатор, представляет собой\
    \ 16-байтный номер. Например: 8dea00e3-9aab-4d8e-887c-ef2aaa546456.\n\n**money**\
    \ - стоимость услуги/товара с учетом налогообложения\n\n| **Название поля** |\
