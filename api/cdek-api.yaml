openapi: 3.0.0
info:
  title: CDEK API
  version: '2.0'
  description: CDEK Integration API - полная документация с https://apidoc.cdek.ru/
servers:
- url: https://api.cdek.ru
  description: Production server
- url: https://api.edu.cdek.ru
  description: Test/Sandbox server
paths:
  /v2/oauth/token:
    post:
      summary: Получение токена авторизации
      description: Взаимодействие с сервисом требует клиентской авторизации. Авторизация
        обеспечивается с применением протокола OAuth 2.0. Метод предназначен для получения
        токена авторизации.
      operationId: getOAuthToken
      tags:
      - auth
      parameters:
      - name: request
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/RequestDto'
      responses:
        '200':
          description: OK
          contentType: application/json
          schema:
            $ref: '#/components/schemas/AuthResponseDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
          examples: null
  /v2/location/suggest/cities:
    get:
      summary: Подбор локации по названию города
      description: "Метод позволяет получать подсказки по подбору населенного пункта\
        \ по его наименованию.<br>\n Список населенных пунктов может быть ограничен\
        \ характеристиками, задаваемыми пользователем."
      operationId: suggestCities
      tags:
      - location
      parameters:
      - name: name
        in: query
        required: true
        type: string
        description: Наименование населенного пункта СДЭК
        schema:
          type: string
      - name: country_code
        in: query
        required: false
        type: string
        description: Код страны в формате ISO_3166-1_alpha-2
        schema:
          type: string
      responses:
        '200':
          description: OK
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SuggestCityResponseDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto'
          examples: null
  /v2/location/regions:
    get:
      summary: Получение списка регионов
      description: 'Метод предназначен для получения детальной информации о регионах.
        <br>

        Список регионов может быть ограничен характеристиками, задаваемыми пользователем.'
      operationId: regions
      tags:
      - location
      parameters:
      - name: country_codes
        in: query
        required: false
        type: string
        description: Список кодов стран в формате ISO_3166-1_alpha-2
        schema:
          type: string
      - name: fias_region_guid
        in: query
        required: false
        type: string
        format: uuid
        description: Уникальный идентификатор ФИАС региона. Устаревшее поле
        schema:
          type: string
          format: uuid
      - name: size
        in: query
        required: false
        type: integer
        format: int32
        description: Ограничение выборки результата. По умолчанию 1000. Обязателен,
          если указан page
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        required: false
        type: integer
        format: int32
        description: Номер страницы выборки результата. По умолчанию 0
        schema:
          type: integer
          format: int32
      - name: lang
        in: query
        required: false
        type: string
        description: Локализация. По умолчанию rus (доступны eng и zho)
        schema:
          type: string
      responses:
        '200':
          description: OK
          contentType: application/json
          schema:
            $ref: '#/components/schemas/RegionsResponseDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto'
          examples: null
  /v2/location/postalcodes:
    get:
      summary: Получение почтовых индексов города
      description: Метод предназначен для получения списка почтовых индексов.
      operationId: postalcodes
      tags:
      - location
      parameters:
      - name: city_code
        in: query
        required: true
        type: integer
        format: int32
        description: Код города, которому принадлежат почтовые индексы
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          contentType: application/json
          schema:
            $ref: '#/components/schemas/PostcodesResponseDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto'
          examples: null
  /v2/location/coordinates:
    get:
      summary: Получение локации по координатам
      description: Метод позволяет определить локацию по переданным в запросе координатам
      operationId: getCityByCoordinates
      tags:
      - location
      parameters:
      - name: latitude
        in: query
        required: true
        type: number
        description: Широта
        schema:
          type: number
      - name: longitude
        in: query
        required: true
        type: number
        description: Долгота
        schema:
          type: number
      responses:
        '200':
          description: OK
          contentType: application/json
          schema:
            $ref: '#/components/schemas/V2LocationCityByCoordinatesDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto'
          examples: null
  /v2/location/cities:
    get:
      summary: Получение списка населенных пунктов
      description: "Метод предназначен для получения детальной информации о населенных\
        \ пунктах.<br>\n Список населенных пунктов может быть ограничен характеристиками,\
        \ задаваемыми пользователем."
      operationId: cities
      tags:
      - location
      parameters:
      - name: country_codes
        in: query
        required: false
        type: string
        description: Массив кодов стран в формате ISO_3166-1_alpha-2
        schema:
          type: string
      - name: region_code
        in: query
        required: false
        type: integer
        format: int32
        description: Код региона (справочник СДЭК)
        schema:
          type: integer
          format: int32
      - name: kladr_region_code
        in: query
        required: false
        type: string
        description: Код КЛАДР региона
        schema:
          type: string
      - name: fias_region_guid
        in: query
        required: false
        type: string
        format: uuid
        description: Уникальный идентификатор ФИАС региона. Устаревшее поле
        schema:
          type: string
          format: uuid
      - name: kladr_code
        in: query
        required: false
        type: string
        description: Код КЛАДР населенного пункта
        schema:
          type: string
      - name: fias_guid
        in: query
        required: false
        type: string
        format: uuid
        description: Уникальный идентификатор ФИАС населенного пункта
        schema:
          type: string
          format: uuid
      - name: postal_code
        in: query
        required: false
        type: string
        description: Почтовый индекс
        schema:
          type: string
      - name: code
        in: query
        required: false
        type: integer
        format: int32
        description: Код населенного пункта СДЭК
        schema:
          type: integer
          format: int32
      - name: city
        in: query
        required: false
        type: string
        description: Название населенного пункта. Должно соответствовать полностью
        schema:
          type: string
      - name: payment_limit
        in: query
        required: false
        type: number
        format: double
        description: 'Ограничение на сумму наложенного платежа. Особые значения: -1
          - ограничения нет; 0 - наложенный платеж не принимается;'
        schema:
          type: number
          format: double
      - name: size
        in: query
        required: false
        type: integer
        format: int32
        description: Ограничение выборки результата. По умолчанию 1000. Обязателен,
          если указан page
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        required: false
        type: integer
        format: int32
        description: Номер страницы выборки результата. По умолчанию 0
        schema:
          type: integer
          format: int32
      - name: lang
        in: query
        required: false
        type: string
        description: Язык локализации ответа
        schema:
          type: string
      responses:
        '200':
          description: OK
          contentType: application/json
          schema:
            $ref: '#/components/schemas/V2LocationCityDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto'
          examples: null
  /v2/print/orders:
    post:
      summary: Формирование квитанции к заказу
      description: 'Метод используется для формирования квитанции в формате pdf к
        заказу/заказам.<br>

        Во избежание перегрузки платформы нельзя передавать более 100 номеров заказов
        в одном запросе.'
      operationId: waybillPrint
      tags:
      - print
      parameters: []
      responses:
        '202':
          description: Accepted
          contentType: application/json
          schema:
            $ref: '#/components/schemas/WaybillPrintResponseDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto1'
          examples: null
      requestBody:
        contentType: application/json
        required: true
        schema:
          $ref: '#/components/schemas/WaybillRequestDto'
        examples: null
  /v2/prealert:
    post:
      summary: Регистрация преалерта
      description: "Метод предназначен для регистрации преалерта (реестра заказов,\
        \ которые клиент собирается передать на склад СДЭК для дальнейшей доставки)\
        \ - информирования со стороны интернет-магазина (далее ИМ) о желании передать\
        \ некоторое количество заказов в СДЭК, чтобы к этому моменту принимающий офис\
        \ подготовил необходимые документы. \nПреалерт нужен, только если ИМ собирается\
        \ передавать большое количество заказов одновременно. Для работы с преалертом\
        \ необходимо, чтобы услуга \"Преалерт\" была подключена по договору. По этому\
        \ вопросу необходимо обратиться напрямую к закрепленному менеджеру или в закрепленный\
        \ офис СДЭК (с кем подписывался договор).<br>\nПреалерт не связан с заявкой\
        \ на вызов курьера."
      operationId: register
      tags:
      - prealert
      parameters: []
      responses:
        '202':
          description: Accepted
          contentType: application/json
          schema:
            $ref: '#/components/schemas/RegisterPrealertResponseDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto1'
          examples: null
      requestBody:
        contentType: application/json
        required: true
        schema:
          $ref: '#/components/schemas/RegisterPrealertRequestDto'
        examples: null
  /v2/orders:
    get:
      summary: Получение информации о заказе по номеру СДЭК/ИМ
      description: 'Метод предоставляет возможность получить детальную информацию
        о ранее созданном заказе по номеру СДЭК/ИМ заказа. В ответе содержатся данные
        о статусе заказа, деталях доставки и информации о получателе.<br>

        Есть возможность получить информацию, в том числе о заказах, которые были
        созданы через другие каналы (личный кабинет, вручную менеджером и др.), но
        только по тем, которые были созданы после первой авторизации по ключам интеграции.'
      operationId: getOrders
      tags:
      - order
      parameters:
      - name: cdek_number
        in: query
        required: false
        format: int64
        description: Номер заказа СДЭК, по которому необходима информация
        schema:
          format: int64
      - name: im_number
        in: query
        required: false
        description: Номер заказа в ИС Клиента, по которому необходима информация
        schema: {}
      responses:
        '200':
          description: OK
          contentType: application/json
          schema:
            $ref: '#/components/schemas/ResponseDtoOrderResponseDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto1'
          examples: null
    post:
      summary: Регистрация заказа
      description: 'Метод предназначен для создания в ИС СДЭК заказа на доставку товаров
        до покупателей. В запросе передается информация об отправителе, получателе,
        параметрах доставки и содержимом отправления. В ответе возвращается уникальный
        идентификатор заказа и текущий статус запроса*. <br>

        Выделяется 2 типа заказов: <br>

        “интернет-магазин” - может быть только у клиента с типом договора “Интернет-магазин”;
        <br>

        “доставка” может быть создан любым клиентом с договором (но доступны тарифы
        только для обычной доставки).<br>


        *Метод работает асинхронно. Статус "ACCEPTED" в ответе на запрос не гарантирует,
        что заказ создан в ИС СДЭК. Этот статус относится к запросу (запрос успешно
        принят) и говорит о том, что запрос прошел первичные валидации и структурно
        составлен корректно. Далее запрос проходит остальные валидации, результат
        можно получить с помощью методов получения информации о заказе. Статус запроса
        "SUCCESSFUL" - сущность успешно создана в системе, статус "INVALID" - при
        создании возникла ошибка, необходимо её исправить и повторно отправить запрос
        на регистрацию заказа.'
      operationId: createOrder
      tags:
      - order
      parameters:
      - name: developer-key
        in: header
        required: false
        schema: {}
      responses:
        '202':
          description: Accepted
          contentType: application/json
          schema:
            $ref: '#/components/schemas/ResponseDtoRootEntityDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto1'
          examples: null
      requestBody:
        contentType: application/json
        required: true
        schema:
          $ref: '#/components/schemas/OrderCreateRequestDto'
        examples: null
    patch:
      summary: Изменение заказа
      description: 'Метод используется для изменения созданного ранее заказа.<br>

        Условием возможности изменения заказа является отсутствие движения груза на
        складе СДЭК (т.е. статус заказа «Создан»).'
      operationId: update
      tags:
      - order
      parameters:
      - name: developer-key
        in: header
        required: false
        schema: {}
      responses:
        '202':
          description: Accepted
          contentType: application/json
          schema:
            $ref: '#/components/schemas/ResponseDtoRootEntityDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto1'
          examples: null
      requestBody:
        contentType: application/json
        required: true
        schema:
          $ref: '#/components/schemas/OrderUpdateRequestDto'
        examples: null
  /v2/intakes/availableDays:
    post:
      summary: Получение дат вызова курьера для НП
      description: Метод позволяет получить доступные даты для забора груза курьером
        со склада интернет-магазина для населенного пункта, в котором находится склад.
      operationId: getAvailableDays
      tags:
      - intake
      parameters: []
      responses:
        '200':
          description: OK
          contentType: application/json
          schema:
            $ref: '#/components/schemas/IntakeAvailableDaysResponseDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto1'
          examples: null
      requestBody:
        contentType: application/json
        required: true
        schema:
          $ref: '#/components/schemas/IntakeAvailableDaysRequestDto'
        examples: null
  /v2/intakes:
    post:
      summary: Регистрация заявки на вызов курьера
      description: 'Метод позволяет осуществить вызов курьера для забора груза со
        склада интернет-магазина с последующей доставкой до склада СДЭК. Рекомендуемый
        минимальный диапазон времени для приезда курьера не менее 3-х часов. В теле
        запроса передаются данные об адресе отправителя, контактном лице, дате и интервале
        времени забора, количестве и характеристиках мест отправления. В ответе возвращается
        уникальный идентификатор заявки и текущий статус запроса*.<br>


        *Метод работает асинхронно. Статус "ACCEPTED" в ответе на запрос не гарантирует,
        что заявка создана в ИС СДЭК. Этот статус относится к запросу (запрос успешно
        принят) и говорит о том, что запрос прошел первичные валидации и структурно
        составлен корректно. Далее запрос проходит остальные валидации, результат
        можно получить с помощью метода получения информации о заявке. Статус запроса
        "SUCCESSFUL" - сущность успешно создана в системе, статус "INVALID" - при
        создании возникла ошибка, необходимо её исправить и повторно отправить запрос
        на регистрацию заявки на вызов курьера.'
      operationId: createIntake
      tags:
      - intake
      parameters: []
      responses:
        '202':
          description: Accepted
          contentType: application/json
          schema:
            $ref: '#/components/schemas/ResponseDtoRootEntityDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto1'
          examples: null
      requestBody:
        contentType: application/json
        required: true
        schema:
          $ref: '#/components/schemas/IntakeDto'
        examples: null
    patch:
      summary: Изменение статуса заявки на вызов курьера
      description: "Метод позволяет изменить статус по действующей заявке на вызов\
        \ курьера на \"Требует обработки\" с передачей дополнительных статусов, если\
        \ по заявке требуются дополнительные операции, такие как прозвон или предоставление\
        \ документов. \n Перейти в статус \"Требует обработки\" могут заявки, которые\
        \ имеют текущий статус Требует обработки/Готова к назначению/Назначен курьер."
      operationId: changeStatus
      tags:
      - intake
      parameters: []
      responses:
        '200':
          description: OK
          contentType: application/json
          schema:
            $ref: '#/components/schemas/IntakeChangeStatusResponseDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto1'
          examples: null
      requestBody:
        contentType: application/json
        required: true
        schema:
          $ref: '#/components/schemas/IntakeChangeStatusDto'
        examples: null
  /v2/print/orders/{uuid}:
    get:
      summary: Получение квитанции к заказу
      description: "Метод используется для получения ссылки на квитанцию в формате\
        \ pdf к заказу/заказам.<br>\nСсылка на файл с квитанцией к заказу/заказам\
        \ доступна в течение 1 часа.<br>\n<br>\nВ ответе метода возвращается набор\
        \ статусов entity->statuses. Их значения могут быть следующими\n| Код    \
        \   | Название статуса    | Комментарий  |\n|-----------|---------------------|--------------|\n\
        | ACCEPTED  | Принят              | Запрос на формирование квитанции принят\
        \ |\n| INVALID   | Некорректный запрос | Некорректный запрос на формирование\
        \ квитанции |\n| PROCESSING| Формируется         | Файл с квитанцией формируется\
        \ |\n| READY     | Сформирован         | Файл с квитанцией и ссылка на скачивание\
        \ файла сформированы|\n| REMOVED   | Удален\t             | Истекло время\
        \ жизни ссылки на скачивание файла с квитанцией|"
      operationId: waybillGet
      tags:
      - print
      parameters:
      - name: uuid
        in: path
        required: true
        format: uuid
        schema:
          format: uuid
      responses:
        '200':
          description: OK
          contentType: application/json
          schema:
            $ref: '#/components/schemas/WaybillGetResponseDto'
          examples: null
        '400':
          description: Bad Request
          contentType: application/json
          schema:
            $ref: '#/components/schemas/SimplifiedResponseDto1'
          examples: null
  /v2/prealert/{uuid}:
    get:
      summary: Получение информации о преалерте
      description: Метод предназначен для получения информации по заданному преалерту
      operationId: getPrealert
      tags:
      - prealert
      parameters:
      - name: uuid
        in: path
        required: true
