          description: Дата доставки, согласованная с получателем
          format: date
        time_from:
          pattern: <HH:mm>
          description: Время начала ожидания курьера
          example: '15:00'
        time_to:
          pattern: <HH:mm>
          description: Время окончания ожидания курьера
